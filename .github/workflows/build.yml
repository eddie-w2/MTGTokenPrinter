name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TOKENPRINTER_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the project key."
          else
            echo "No signing key set. Using the debug key."
          fi
      - name: Build APKs
        env:
          TOKENPRINTER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOKENPRINTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOKENPRINTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -o pipefail
          gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log || {
            # Surface the reason as annotations so it shows at the top of the run page.
            grep -E "^e: |What went wrong|Execution failed|error:|Error:|FAILED" -A3 build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Publish release for the in-app updater
        # Only the official repository publishes updates; forks build but never release.
        if: github.repository == 'eddie-w2/MTGTokenPrinter' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          HAVE_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          # Releases go to a public repo so the installed app can read them without a login.
          if [ -z "$GH_TOKEN" ]; then echo "::warning::RELEASES_TOKEN is not set, so no update was published."; exit 0; fi
          if [ "$HAVE_KEY" != "true" ]; then echo "::warning::Not signed with the project key, so no update was published."; exit 0; fi
          VERSION=$(grep -m1 'versionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          CODE=$(grep -m1 'versionCode' app/build.gradle.kts | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          REPO=eddie-w2/MTGTokenPrinter-releases
          if gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1; then
            echo "::notice::Release v$VERSION already exists, leaving it alone."; exit 0
          fi
          NAME="TokenPrinter-$VERSION-code$CODE.apk"
          cp app/build/outputs/apk/release/app-release.apk "$NAME"
          sha256sum "$NAME" | cut -d' ' -f1 > "$NAME.sha256"
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## / {f=0} f' CHANGELOG.md | sed '/./,$!d' > notes.md
          if [ ! -s notes.md ]; then echo "Bug fixes and improvements." > notes.md; fi
          gh release create "v$VERSION" "$NAME" "$NAME.sha256" --repo "$REPO" --title "Token Printer $VERSION" --notes-file notes.md --latest
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: TokenPrinter-apks
          path: app/build/outputs/apk/*/*.apk
