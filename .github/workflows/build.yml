name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "TOKENPRINTER_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the project key."
          else
            echo "No signing key set. Using the debug key."
          fi
      - name: Build APKs
        env:
          TOKENPRINTER_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TOKENPRINTER_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TOKENPRINTER_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v5
        with:
          name: TokenPrinter-apks
          path: app/build/outputs/apk/*/*.apk
